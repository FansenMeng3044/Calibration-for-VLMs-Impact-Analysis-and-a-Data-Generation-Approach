# LAVIS_backup + TAMP 剪枝 用 Conda 环境
# 创建并激活: conda env create -f environment.yml && conda activate lavis_backup
# 然后在本项目根目录执行: pip install -e .

name: lavis_backup
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.8
  - pip
  - numpy<2
  # PyTorch：下面二选一
  # (1) CUDA 11.7/11.8
  - pytorch::pytorch=1.13.1
  - pytorch::torchvision=0.14.1
  - pytorch::torchaudio=0.13.1
  - nvidia::cudatoolkit=11.7
  # (2) 仅 CPU：注释上面 4 行，取消下面 3 行注释
  # - pytorch::pytorch
  # - pytorch::torchvision
  # - pytorch::torchaudio
  - omegaconf
  - pyyaml
  - tqdm
  - pip: []
