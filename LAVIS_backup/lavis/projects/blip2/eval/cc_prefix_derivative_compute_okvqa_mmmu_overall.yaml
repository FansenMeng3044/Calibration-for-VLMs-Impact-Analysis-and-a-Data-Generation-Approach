# MMMU calibration（dev+validation 多选题，单图）
# 生成: python scripts/blip2/mmmu_to_calibration_format.py \
#   --mmmu_root /data/data2/mfs/MMMU_single_image --out_dir /data/data2/mfs/MMMU_calibration
model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  pretrained: "/data/data2/mfs/model_cache/torch/hub/checkpoints/blip2_pretrained_flant5xl.pth"

datasets:
  prefix_conceptual_caption_3m:
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
    build_info:
      annotations:
        train:
          storage:
              - /data/data2/mfs/MMMU_calibration/mmmu_calibration_train.json
      images:
          storage: /data/data2/mfs/MMMU_calibration/images

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-6
  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 2
  batch_size_eval: 2
  num_workers: 4
  warmup_steps: 1000
  seed: 42
  output_dir: "output/BLIP2/MMMU_calibration"
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  test_splits: ["train"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
