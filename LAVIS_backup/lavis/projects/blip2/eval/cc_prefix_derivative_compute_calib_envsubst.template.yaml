# 由 scripts/blip2/run_lavisbackup_tamp_llmonly_12prune_48eval.sh 通过 envsubst 生成临时 cfg。
# 占位（export 后执行）: $BLIP2_PRETRAINED $CALIB_JSON $CALIB_IMAGES $RUN_SEED
# 标注 JSON: 含 caption；或 question+answer（OKVQA answer 可为 list，取首项）。
# Copyright (c) 2022, salesforce.com, inc.
# SPDX-License-Identifier: BSD-3-Clause

model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  pretrained: "$BLIP2_PRETRAINED"

datasets:
  prefix_conceptual_caption_3m:
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
    build_info:
      annotations:
        train:
          url:
            - "$CALIB_JSON"
          storage:
            - "$CALIB_JSON"
      images:
        storage: "$CALIB_IMAGES"

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-6

  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 16
  batch_size_eval: 16
  num_workers: 4
  warmup_steps: 1000

  seed: $RUN_SEED
  output_dir: "output/BLIP2/Pretrain_stage2"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  test_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
