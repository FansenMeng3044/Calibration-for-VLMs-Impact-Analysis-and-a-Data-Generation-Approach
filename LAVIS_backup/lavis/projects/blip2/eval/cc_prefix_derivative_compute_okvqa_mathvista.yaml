# MathVista calibration（multi_choice + free_form → OK-VQA 格式 JSON）
model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  pretrained: "/data/data2/mfs/model_cache/torch/hub/checkpoints/blip2_pretrained_flant5xl.pth"

datasets:
  prefix_conceptual_caption_3m:
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
    text_processor:
        train:
          name: "blip_caption"
    build_info:
      annotations:
        train:
          storage:
              - /data/data2/mfs/MathVista_calibration/mathvista_calibration_train.json
      images:
        # HF images.zip 解压后多为 images/images/*.jpg（与 json 里相对路径一致）
        storage: /data/data2/mfs/MathVista_calibration/images/images

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-6
  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 2
  batch_size_eval: 2
  num_workers: 4
  warmup_steps: 1000
  seed: 42
  output_dir: "output/BLIP2/MathVista_OKVQA_calibration"
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  test_splits: ["train"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
