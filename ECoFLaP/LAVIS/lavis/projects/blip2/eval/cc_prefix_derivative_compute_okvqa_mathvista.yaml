# MathVista calibration（multi_choice + free_form 已转换成 OK-VQA calibration JSON）
# 标注：/root/autodl-tmp/MathVista_calibration/mathvista_calibration_train.json
# 图片：/root/autodl-tmp/MathVista_calibration/images
model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False

datasets:
  prefix_okvqa_calibration:
    vis_processor:
        train:
          name: "blip2_image_train"
          image_size: 224
    text_processor:
        train:
          name: "blip_question"
    build_info:
      annotations:
        train:
          storage:
              - /root/autodl-tmp/MathVista_calibration/mathvista_calibration_train.json
      images:
        storage: /root/autodl-tmp/MathVista_calibration/images

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-6
  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 2
  batch_size_eval: 2
  num_workers: 4
  warmup_steps: 1000
  seed: 42
  output_dir: "output/BLIP2/MathVista_OKVQA_calibration"
  amp: True
  resume_ckpt_path: null
  evaluate: False
  train_splits: ["train"]
  test_splits: ["train"]
  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
