# =============================================================================
# CC3M 小规模 calibration（128 条）：seed20260411 子集，本地 json + images
# 数据：/data/data2/mfs/CC3M_calib_128_seed20260411/cc3m_calib_128.json + images/
# 预训练权重（本机）: cache_moved/torch/hub/checkpoints/blip2_pretrained_flant5xl.pth
# 换机器请改 model.pretrained 与下方 json/images 路径。
# 用法：与 cc_prefix_derivative_compute_cc3m_calib128.yaml 相同，仅 cfg 文件名不同。
# =============================================================================
# Copyright (c) 2022, salesforce.com, inc.
# SPDX-License-Identifier: BSD-3-Clause

model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  pretrained: "/data/data2/mfs/model_cache/torch/hub/checkpoints/blip2_pretrained_flant5xl.pth"

datasets:
  prefix_conceptual_caption_3m:
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
    text_processor:
      train:
        name: "blip_caption"
    build_info:
      annotations:
        train:
          url:
            - /data/data2/mfs/CC3M_calib_128_seed20260411/cc3m_calib_128.json
          storage:
            - /data/data2/mfs/CC3M_calib_128_seed20260411/cc3m_calib_128.json
      images:
        storage: /data/data2/mfs/CC3M_calib_128_seed20260411/images

run:
  task: image_text_pretrain
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-4
  min_lr: 1e-5
  warmup_lr: 1e-6

  weight_decay: 0.05
  max_epoch: 1
  batch_size_train: 16
  batch_size_eval: 16
  num_workers: 4
  warmup_steps: 1000

  seed: 42
  output_dir: "output/BLIP2/Pretrain_stage2"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  test_splits: ["train"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
